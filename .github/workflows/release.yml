# Выпуск версии: git tag v0.4.0 && git push origin v0.4.0
#  - образ сервера ghcr.io/<owner>/sentinel-monitor-server:<версия> и :latest (для deploy/install.sh)
#  - установщики для Windows и пакет агента — в GitHub Release
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-server:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Кэш редистрибутивов (.NET 4.8, VC++, PostgreSQL)
        uses: actions/cache@v4
        with:
          path: installers/redist
          key: redist-${{ hashFiles('installers/build.ps1') }}
      - name: Сборка установщиков
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          powershell -NoProfile -ExecutionPolicy Bypass -File installers/build.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/SentinelAgent-*.zip
            artifacts/SentinelAgent-Setup-*.exe
            artifacts/SentinelServer-Setup-*.exe

  release:
    needs: [docker, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: SHA256
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Установка

            **Сервер на Linux** (Ubuntu/Debian, Docker ставится сам):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/install.sh | sudo SENTINEL_VERSION=${{ github.ref_name }} bash
            ```

            **Сервер на Windows Server 2016+**: `SentinelServer-Setup-*.exe` (PostgreSQL и всё нужное — внутри).

            **Агент**: команда со страницы «Установка агентов» в дашборде или офлайн-установщик `SentinelAgent-Setup-*.exe` (внутри .NET Framework 4.8, Windows Server 2008 R2 SP1+).
            Пакет `SentinelAgent-*.zip` загрузите в дашборде («Установка агентов» → «Дистрибутив агента») — агенты обновятся сами.
