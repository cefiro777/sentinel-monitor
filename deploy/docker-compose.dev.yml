# Только PostgreSQL для локальной разработки: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - sentinel-dev-pg:/var/lib/postgresql/data

volumes:
  sentinel-dev-pg:
